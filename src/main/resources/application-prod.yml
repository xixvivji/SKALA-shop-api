spring:
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://elasticsearch:9200}
    connection-timeout: 2s
    socket-timeout: 3s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# API(8080)와 관리 트래픽을 분리합니다. 운영 Compose는 9090을 호스트에 공개하지 않고
# Prometheus와 Nginx health proxy만 같은 Docker 내부망에서 접근합니다.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}

shopping:
  outbox:
    relay-enabled: true
    poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
  security:
    refresh-token:
      store: redis
    jwt:
      secret: ${JWT_SECRET}
    cookie:
      secure: true
    rate-limit:
      store: redis

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.skala.shopping: INFO
