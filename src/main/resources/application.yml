spring:
  application:
    name: skala-shop-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skala_shop}
    username: ${DB_USERNAME:skala}
    password: ${DB_PASSWORD:skala}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  forward-headers-strategy: framework

springdoc:
  packages-to-scan: com.skala.shopping
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    with-credentials: true
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

shopping:
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:false}
    poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
    publisher: ${OUTBOX_PUBLISHER:logging}
    kafka-topic: ${OUTBOX_KAFKA_TOPIC:skala-shop.domain-events}
    kafka-timeout: ${OUTBOX_KAFKA_TIMEOUT:5s}
  observability:
    correlation-header: X-Correlation-ID

  logging:
    api:
      # 본문·헤더·쿠키를 제외한 메서드, 경로 패턴, 상태 코드와 처리 시간만 기록합니다.
      enabled: ${API_LOGGING_ENABLED:true}
  member:
    # 브라우저에서도 센트 단위 정밀도를 유지하도록 0 이상 30조 이하로 제한합니다.
    initial-points: ${INITIAL_MEMBER_POINTS:1000000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:skala-shop-api}
      secret: ${JWT_SECRET:local-development-secret-must-be-at-least-32-bytes}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
    refresh-token:
      store: ${REFRESH_TOKEN_STORE:memory}
    cookie:
      name: bff-access
      refresh-name: bff-refresh
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    rate-limit:
      # 단일 EC2 인스턴스용 인메모리 제한입니다. 다중 인스턴스 전환 시 공유 저장소 구현이 필요합니다.
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      store: ${AUTH_RATE_LIMIT_STORE:memory}
      # 서로 다른 IP·계정 키가 과도하게 쌓이면 새 키 요청을 429로 차단합니다.
      max-tracked-keys: ${AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:50000}
      login:
        max-requests-per-ip: ${AUTH_LOGIN_IP_LIMIT:100}
        max-requests-per-account: ${AUTH_LOGIN_ACCOUNT_LIMIT:20}
        window: ${AUTH_LOGIN_RATE_WINDOW:1m}
      registration:
        max-requests-per-ip: ${AUTH_REGISTRATION_IP_LIMIT:30}
        max-requests-per-account: ${AUTH_REGISTRATION_ACCOUNT_LIMIT:5}
        window: ${AUTH_REGISTRATION_RATE_WINDOW:10m}
      # 현재 초기화는 SMTP 없이 고객 ID와 이름만 확인하는 임시 흐름입니다.
      # 계정 소유를 강하게 증명하지 못하므로 외부 공개 시 아래 제한을 낮추고 추후 일회용 토큰 방식으로 교체해야 합니다.
      password-reset:
        max-requests-per-ip: ${AUTH_PASSWORD_RESET_IP_LIMIT:20}
        max-requests-per-account: ${AUTH_PASSWORD_RESET_ACCOUNT_LIMIT:5}
        window: ${AUTH_PASSWORD_RESET_RATE_WINDOW:10m}
