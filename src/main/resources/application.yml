spring:
  application:
    name: skala-shop-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/skala_shop}
    username: ${DB_USERNAME:skala}
    password: ${DB_PASSWORD:skala}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  forward-headers-strategy: framework

springdoc:
  packages-to-scan: com.skala.shopping
  paths-to-match: /api/**
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    with-credentials: true
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

shopping:
  member:
    initial-points: ${INITIAL_MEMBER_POINTS:1000000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:skala-shop-api}
      secret: ${JWT_SECRET:local-development-secret-must-be-at-least-32-bytes}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
    cookie:
      name: bff-access
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAME_SITE:Lax}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:5500}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      login-id: ${BOOTSTRAP_ADMIN_LOGIN_ID:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
