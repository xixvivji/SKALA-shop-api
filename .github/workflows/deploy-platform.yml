name: Deploy platform

on:
  workflow_dispatch:
    inputs:
      target:
        description: "재배포할 플랫폼"
        required: true
        type: choice
        options:
          - kafka

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-platform-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate platform deployment script
        run: bash -n deploy/scripts/deploy-platform-via-ssm.sh
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve immutable platform target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          KAFKA_INSTANCE_ID: ${{ vars.KAFKA_INSTANCE_ID }}
          KAFKA_PRIVATE_IP: ${{ vars.KAFKA_PRIVATE_IP }}
        run: |
          [[ "$TARGET" == "kafka" ]]
          printf 'instance_id=%s\n' "$KAFKA_INSTANCE_ID" >> "$GITHUB_OUTPUT"
          printf 'private_ip=%s\n' "$KAFKA_PRIVATE_IP" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s\n' 'apache/kafka@sha256:5cc2a2fd93fa2687b44015eee04fb2c3edd9e526bd64bf8bec5ff1e268772e0e' >> "$GITHUB_OUTPUT"
      - name: Deploy through Systems Manager
        shell: bash
        run: >-
          bash deploy/scripts/deploy-platform-via-ssm.sh
          '${{ vars.AWS_REGION }}'
          '${{ inputs.target }}'
          '${{ steps.target.outputs.instance_id }}'
          '${{ steps.target.outputs.private_ip }}'
          '${{ steps.target.outputs.image_ref }}'
