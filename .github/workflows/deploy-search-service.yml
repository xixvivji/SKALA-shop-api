name: Deploy search service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-search-service
  cancel-in-progress: false

jobs:
  test:
    name: Search Service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test Search Service and Kafka event contract
        run: |
          ./gradlew :search-service:test --no-daemon
          ./gradlew :test \
            --tests 'com.skala.shopping.outbox.internal.KafkaOutboxMessagePublisherTests' \
            --tests 'com.skala.shopping.outbox.internal.OutboxEventRecorderTests' \
            --no-daemon
      - name: Validate deployment files
        env:
          ELASTICSEARCH_IMAGE_REF: docker.elastic.co/elasticsearch/elasticsearch@sha256:d413f19aaeec97c924161c405f12a2c907552c640d7239766f05b17ea94382f1
          SEARCH_SERVICE_IMAGE_REF: xixii/skala-shop-api@sha256:8bfe2e54635aa1dd5ffcf0ed62cd30f6053e42577e01deb9332975dffa74f183
          SEARCH_SERVICE_BIND_IP: 172.31.32.50
          KAFKA_BOOTSTRAP_SERVERS: 172.31.36.153:9092
          CATALOG_BASE_URL: https://api.example.com
        run: |
          docker compose -f deploy/compose.search.yml config --quiet
          bash -n deploy/scripts/deploy-search-service-via-ssm.sh
          SEARCH_DEPLOY_DRY_RUN=true bash deploy/scripts/deploy-search-service-via-ssm.sh \
            ap-northeast-2 i-0123456789abcdef0 172.31.32.50 \
            172.31.36.153:9092 https://api.example.com \
            xixii/skala-shop-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            docker.elastic.co/elasticsearch/elasticsearch@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.immutable_image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: search-service/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_IMAGE }}:search-${{ github.sha }}
          cache-from: type=gha,scope=search-service
          cache-to: type=gha,mode=max,scope=search-service
      - id: immutable_image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy immutable Search Service image
        env:
          SEARCH_IMAGE_REF: ${{ vars.DOCKERHUB_IMAGE }}@${{ needs.publish.outputs.image_digest }}
        run: |
          bash deploy/scripts/deploy-search-service-via-ssm.sh \
            '${{ vars.AWS_REGION }}' \
            '${{ vars.SEARCH_INSTANCE_ID }}' \
            '${{ vars.SEARCH_PRIVATE_IP }}' \
            '${{ vars.KAFKA_PRIVATE_IP }}:9092' \
            '${{ vars.PRODUCTION_API_ORIGIN }}' \
            "$SEARCH_IMAGE_REF" \
            'docker.elastic.co/elasticsearch/elasticsearch@sha256:d413f19aaeec97c924161c405f12a2c907552c640d7239766f05b17ea94382f1'
