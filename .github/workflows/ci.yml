name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Simulate deployment release flow
        run: sh deploy/tests/release-flow-test.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check frontend/runtime-config.js
          node --check frontend/config.js
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/scripts/build.mjs
      - name: Validate static files
        run: node frontend/scripts/validate-static.mjs
      - name: Build deployable static files
        env:
          SKALA_API_BASE_URL: https://api.example.com
        run: node frontend/scripts/build.mjs
