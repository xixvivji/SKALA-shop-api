name: Deploy production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      bootstrap_tls:
        description: "최초 배포에서 Let's Encrypt 인증서를 발급합니다"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Validate public Docker demo
        run: docker compose -f compose.demo.yml config --quiet
      - name: Validate independent Search Service deployment
        env:
          ELASTICSEARCH_IMAGE_REF: docker.elastic.co/elasticsearch/elasticsearch@sha256:d413f19aaeec97c924161c405f12a2c907552c640d7239766f05b17ea94382f1
          SEARCH_SERVICE_IMAGE_REF: xixii/skala-shop-api@sha256:8bfe2e54635aa1dd5ffcf0ed62cd30f6053e42577e01deb9332975dffa74f183
          SEARCH_SERVICE_BIND_IP: 172.31.32.50
          KAFKA_BOOTSTRAP_SERVERS: 172.31.36.153:9092
          CATALOG_BASE_URL: https://api.example.com
        run: |
          docker compose -f deploy/compose.search.yml config --quiet
          bash -n deploy/scripts/deploy-search-service-via-ssm.sh
          SEARCH_DEPLOY_DRY_RUN=true bash deploy/scripts/deploy-search-service-via-ssm.sh \
            ap-northeast-2 i-0123456789abcdef0 172.31.32.50 \
            172.31.36.153:9092 https://api.example.com \
            xixii/skala-shop-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            docker.elastic.co/elasticsearch/elasticsearch@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - name: Validate production monitoring configuration
        run: sh deploy/tests/monitoring-config-test.sh
      - name: Simulate deployment release flow
        run: sh deploy/tests/release-flow-test.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check frontend/runtime-config.js
          node --check frontend/config.js
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/scripts/build.mjs
          node --check frontend/tests/live-production.spec.js
          node --check deploy/tools/http-client.mjs
          node --check deploy/tools/bootstrap-catalog.mjs
          node --check deploy/tools/verify-commerce-flow.mjs
          node --check deploy/tools/smoke-production.mjs
      - name: Validate static files
        run: node frontend/scripts/validate-static.mjs
      - name: Build deployable static files
        env:
          SKALA_API_BASE_URL: https://api.example.com
        run: node frontend/scripts/build.mjs
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        working-directory: frontend
        run: npm run test:e2e

  publish:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    needs:
      - test
      - frontend
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.immutable_image.outputs.image_digest }}
      search_image_digest: ${{ steps.immutable_search_image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: immutable_image
        name: Record immutable image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - id: build_search
        name: Build and publish Search Service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: search-service/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_IMAGE }}:search-${{ github.sha }}
          cache-from: type=gha,scope=search-service
          cache-to: type=gha,mode=max,scope=search-service
      - id: immutable_search_image
        name: Record immutable Search Service image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build_search.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Verify public Docker demo
        shell: bash
        env:
          BACKEND_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}@${{ steps.build.outputs.digest }}
          DEMO_API_PORT: "18080"
        run: |
          DEMO_SMOKE_DIR="$(mktemp -d)"
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              docker compose -f compose.demo.yml logs --no-color || true
            fi
            docker compose -f compose.demo.yml down -v --remove-orphans || true
            rm -rf "$DEMO_SMOKE_DIR" || true
            exit "$exit_code"
          }
          trap cleanup EXIT

          # 게시 계정의 자격 증명을 지운 뒤 공개 pull 경로 자체를 검증합니다.
          docker logout
          docker compose -f compose.demo.yml up -d --wait
          curl --fail --silent --show-error \
            --output "$DEMO_SMOKE_DIR/health.json" \
            http://127.0.0.1:18080/actuator/health
          grep -q '"status":"UP"' "$DEMO_SMOKE_DIR/health.json"

          curl --fail --silent --show-error \
            --output "$DEMO_SMOKE_DIR/openapi.json" \
            http://127.0.0.1:18080/v3/api-docs
          grep -q '"openapi"' "$DEMO_SMOKE_DIR/openapi.json"

          # 긴 Prometheus 응답을 pipe로 넘기면 grep -q가 먼저 종료하면서
          # pipefail이 curl의 broken pipe(23)를 실패로 판단할 수 있습니다.
          curl --fail --silent --show-error \
            --output "$DEMO_SMOKE_DIR/prometheus.txt" \
            http://127.0.0.1:18080/actuator/prometheus
          grep -q '^# HELP http_server_requests' "$DEMO_SMOKE_DIR/prometheus.txt"
      - name: Restore Docker Hub credentials for tag promotion
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
      - name: Promote verified public Docker demo tag
        shell: bash
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # 가변 demo 별칭은 익명 pull과 실행 검증을 통과한 digest에만 부여합니다.
          docker buildx imagetools create \
            --tag "$DOCKERHUB_IMAGE:demo" \
            "$DOCKERHUB_IMAGE@$IMAGE_DIGEST"
          [[ "$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:demo" --format '{{.Manifest.Digest}}')" == "$IMAGE_DIGEST" ]]

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy commit through Systems Manager
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          BACKEND_IMAGE_REF: ${{ vars.DOCKERHUB_IMAGE }}@${{ needs.publish.outputs.image_digest }}
          BOOTSTRAP_TLS: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_tls || false }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_IMAGE_REF" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]

          if [[ "$BOOTSTRAP_TLS" == "true" ]]; then
            DEPLOY_SCRIPT=bootstrap-tls.sh
          else
            DEPLOY_SCRIPT=deploy.sh
          fi

          # 필요한 runtime 파일은 SSM command에 한 번만 base64 archive로 포함합니다.
          # 전체 script를 다시 인코딩하지 않아 AWS RunShellScript 24KB 제한 안에 둡니다.
          REMOTE_COMMAND=$(sh deploy/tools/build-deploy-payload.sh \
            "$RELEASE_ID" \
            "$SOURCE_REVISION" \
            "$BACKEND_IMAGE_REF" \
            "$DEPLOY_SCRIPT"
          )
          [[ "${#REMOTE_COMMAND}" -le 23000 ]]

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "SKALA Shop release $RELEASE_ID" \
            --timeout-seconds 900 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          # AWS CLI 기본 waiter는 약 100초 후 종료됩니다. 이미지 pull, health 검사와
          # rollback까지 기다릴 수 있도록 SSM terminal status를 최대 15분 polling합니다.
          INVOCATION=
          COMMAND_STATUS=Pending
          for attempt in $(seq 1 180); do
            if INVOCATION=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json 2>/dev/null); then
              COMMAND_STATUS=$(jq -r '.Status' <<< "$INVOCATION")
              case "$COMMAND_STATUS" in
                Success|Cancelled|TimedOut|Failed|Undeliverable|Terminated)
                  break
                  ;;
              esac
            fi
            sleep 5
          done

          [[ -n "$INVOCATION" ]]
          jq -r '.StandardOutputContent' <<< "$INVOCATION"
          jq -r '.StandardErrorContent' <<< "$INVOCATION" >&2
          [[ "$COMMAND_STATUS" == "Success" ]]

      # Backend는 Search Service 장애 시 PostgreSQL로 폴백합니다. 따라서 새 gateway를
      # 먼저 배포한 뒤 Search Service를 교체하면 중간 실패에도 기존 쇼핑 흐름이 유지됩니다.
      - name: Deploy independent Search Service through Systems Manager
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          SEARCH_INSTANCE_ID: ${{ vars.SEARCH_INSTANCE_ID }}
          SEARCH_PRIVATE_IP: ${{ vars.SEARCH_PRIVATE_IP }}
          KAFKA_PRIVATE_IP: ${{ vars.KAFKA_PRIVATE_IP }}
          CATALOG_BASE_URL: ${{ vars.PRODUCTION_API_ORIGIN }}
          SEARCH_IMAGE_REF: ${{ vars.DOCKERHUB_IMAGE }}@${{ needs.publish.outputs.search_image_digest }}
          ELASTICSEARCH_IMAGE_REF: docker.elastic.co/elasticsearch/elasticsearch@sha256:d413f19aaeec97c924161c405f12a2c907552c640d7239766f05b17ea94382f1
        run: |
          bash deploy/scripts/deploy-search-service-via-ssm.sh \
            "$AWS_REGION" \
            "$SEARCH_INSTANCE_ID" \
            "$SEARCH_PRIVATE_IP" \
            "$KAFKA_PRIVATE_IP:9092" \
            "$CATALOG_BASE_URL" \
            "$SEARCH_IMAGE_REF" \
            "$ELASTICSEARCH_IMAGE_REF"

      - name: Verify public API and monitoring edge
        env:
          SKALA_FRONTEND_ORIGIN: ${{ vars.PRODUCTION_FRONTEND_ORIGIN }}
          SKALA_API_BASE_URL: ${{ vars.PRODUCTION_API_ORIGIN }}
        run: node deploy/tools/smoke-production.mjs
