name: Deploy production

on:
  push:
    branches:
      - main
    paths-ignore:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      bootstrap_tls:
        description: "최초 배포에서 Let's Encrypt 인증서를 발급합니다"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Simulate deployment release flow
        run: sh deploy/tests/release-flow-test.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check frontend/runtime-config.js
          node --check frontend/config.js
          node --check frontend/js/api.js
          node --check frontend/js/app.js
          node --check frontend/scripts/build.mjs
      - name: Validate static files
        run: node frontend/scripts/validate-static.mjs
      - name: Build deployable static files
        env:
          SKALA_API_BASE_URL: https://api.example.com
        run: node frontend/scripts/build.mjs
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        working-directory: frontend
        run: npm run test:e2e

  publish:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    needs:
      - test
      - frontend
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.immutable_image.outputs.image_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ vars.DOCKERHUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: immutable_image
        name: Record immutable image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy commit through Systems Manager
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          BACKEND_IMAGE_REF: ${{ vars.DOCKERHUB_IMAGE }}@${{ needs.publish.outputs.image_digest }}
          BOOTSTRAP_TLS: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_tls || false }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_IMAGE_REF" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]

          REMOTE_RELEASE_DIR="/opt/skala-shop/releases/$RELEASE_ID"
          if [[ "$BOOTSTRAP_TLS" == "true" ]]; then
            DEPLOY_SCRIPT=bootstrap-tls.sh
          else
            DEPLOY_SCRIPT=deploy.sh
          fi

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail
          RELEASE_ID='$RELEASE_ID'
          SOURCE_REPOSITORY='$SOURCE_REPOSITORY'
          SOURCE_REVISION='$SOURCE_REVISION'
          BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF'
          DEPLOY_SCRIPT='$DEPLOY_SCRIPT'
          REMOTE_RELEASE_DIR='$REMOTE_RELEASE_DIR'
          ARCHIVE_ROOT='${SOURCE_REPOSITORY#*/}-$SOURCE_REVISION'
          ARCHIVE_FILE="/tmp/skala-shop-$RELEASE_ID.tar.gz"
          trap 'rm -f "\$ARCHIVE_FILE"' EXIT
          install -d -m 755 -o ubuntu -g ubuntu "\$REMOTE_RELEASE_DIR"
          curl -fsSL "https://codeload.github.com/\$SOURCE_REPOSITORY/tar.gz/\$SOURCE_REVISION" -o "\$ARCHIVE_FILE"
          tar -xzf "\$ARCHIVE_FILE" -C "\$REMOTE_RELEASE_DIR" --strip-components=2 "\$ARCHIVE_ROOT/deploy"
          chown -R ubuntu:ubuntu "\$REMOTE_RELEASE_DIR"
          chmod 700 "\$REMOTE_RELEASE_DIR"/scripts/*.sh
          runuser -u ubuntu -- env HOME=/home/ubuntu "\$REMOTE_RELEASE_DIR/scripts/\$DEPLOY_SCRIPT" "\$RELEASE_ID" "\$BACKEND_IMAGE_REF"
          EOF
          )
          REMOTE_SCRIPT_BASE64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)
          REMOTE_COMMAND="printf '%s' '$REMOTE_SCRIPT_BASE64' | base64 -d | bash"

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "SKALA Shop release $RELEASE_ID" \
            --timeout-seconds 900 \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          INVOCATION=$(aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --output json)
          jq -r '.StandardOutputContent' <<< "$INVOCATION"
          jq -r '.StandardErrorContent' <<< "$INVOCATION" >&2
          COMMAND_STATUS=$(jq -r '.Status' <<< "$INVOCATION")
          [[ "$WAIT_STATUS" -eq 0 && "$COMMAND_STATUS" == "Success" ]]
