# 로컬 시연 전용 구성입니다. 별도 설정 없이 다음 한 명령으로 시작할 수 있습니다.
# docker compose -f compose.demo.yml up -d --wait
name: skala-shop-demo

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${DEMO_DB_NAME:-skala_shop}
      POSTGRES_USER: ${DEMO_DB_USERNAME:-skala_demo}
      # 알려진 기본값은 localhost 시연 전용입니다. DB 포트는 호스트에 공개하지 않습니다.
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-skala-demo-internal-db-password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    expose:
      - "5432"
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  backend:
    image: ${BACKEND_IMAGE:-xixii/skala-shop-api:demo}
    pull_policy: always
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${DEMO_DB_NAME:-skala_shop}
      DB_USERNAME: ${DEMO_DB_USERNAME:-skala_demo}
      DB_PASSWORD: ${DEMO_DB_PASSWORD:-skala-demo-internal-db-password}
      JWT_SECRET: ${DEMO_JWT_SECRET:-skala-demo-only-jwt-secret-change-before-sharing-2026}
      JWT_ISSUER: skala-shop-api-demo
      JWT_COOKIE_SECURE: "false"
      JWT_COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: ${DEMO_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}
      REFRESH_TOKEN_STORE: memory
      AUTH_RATE_LIMIT_STORE: memory
      SEARCH_ENABLED: "false"
      OUTBOX_RELAY_ENABLED: "false"
      # 데모 구성에는 Redis와 Elasticsearch가 없으므로 해당 선택적 Health Indicator를 제외합니다.
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: "false"
      BOOTSTRAP_ADMIN_ENABLED: ${DEMO_BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_LOGIN_ID: ${DEMO_BOOTSTRAP_ADMIN_LOGIN_ID:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${DEMO_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      # 외부 인터페이스가 아닌 실행한 PC의 localhost에만 API를 공개합니다.
      - "127.0.0.1:${DEMO_API_PORT:-8080}:8080"
    networks:
      - edge
      - database
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 45s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
  database:
    internal: true

volumes:
  demo-postgres-data:
